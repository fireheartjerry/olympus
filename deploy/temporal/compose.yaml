name: fire-temporal

services:
  schema:
    image: temporalio/admin-tools@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export SQL_PASSWORD="$$(cat /run/secrets/temporal_postgres_password)"
        exec /opt/fire/setup-postgres.sh
    environment:
      DB_PORT: "5432"
      POSTGRES_SEEDS: olympus-postgres
      POSTGRES_USER: temporal
    secrets:
      - temporal_postgres_password
    volumes:
      - ./scripts/setup-postgres.sh:/opt/fire/setup-postgres.sh:ro
    networks: [authority_backend]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

  server:
    image: temporalio/server@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
    container_name: fire-temporal
    user: "1000:1000"
    command:
      - /bin/sh
      - -ec
      - |
        export POSTGRES_PWD="$$(cat /run/secrets/temporal_postgres_password)"
        exec /etc/temporal/entrypoint.sh
    depends_on:
      schema:
        condition: service_completed_successfully
    environment:
      BIND_ON_IP: 127.0.0.1
      DB: postgres12
      DBNAME: temporal
      DB_PORT: "5433"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production-sql.yaml
      LOG_LEVEL: info
      NUM_HISTORY_SHARDS: "4"
      POSTGRES_SEEDS: 127.0.0.1
      POSTGRES_USER: temporal
      SQL_MAX_CONNS: "12"
      SQL_MAX_IDLE_CONNS: "6"
      SQL_VIS_MAX_CONNS: "6"
      SQL_VIS_MAX_IDLE_CONNS: "3"
      VISIBILITY_DBNAME: temporal_visibility
    secrets:
      - temporal_postgres_password
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    # Host networking avoids a Docker NAT failure mode while remaining private:
    # every Temporal RPC service binds only 127.0.0.1, and PostgreSQL is already
    # published only on host loopback port 5433.
    network_mode: host
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  namespace:
    image: temporalio/admin-tools@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/opt/fire/create-namespace.sh"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      DEFAULT_NAMESPACE: default
      NAMESPACE_RETENTION: 7d
      TEMPORAL_ADDRESS: 127.0.0.1:7233
    volumes:
      - ./scripts/create-namespace.sh:/opt/fire/create-namespace.sh:ro
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

secrets:
  temporal_postgres_password:
    file: ${FIRE_TEMPORAL_POSTGRES_PASSWORD_FILE:?set FIRE_TEMPORAL_POSTGRES_PASSWORD_FILE}

networks:
  authority_backend:
    external: true
    name: ${FIRE_AUTHORITY_BACKEND_NETWORK:-fire-authority-backend}
