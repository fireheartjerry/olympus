[build-system]
requires = ["hatchling==1.31.0", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "olympus"
version = "0.1.0"
description = "Governed durable orchestration for the Olympus agent platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "pynacl>=1.5,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "temporalio>=1.9,<2",
  "uvicorn>=0.34,<1",
  "webauthn>=2.5,<3",
]

[dependency-groups]
dev = [
  "editables==0.5",
  "hatchling==1.31.0",
  "hypothesis>=6.135,<7",
  "httpx2>=2,<3",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.9,<1",
]

[tool.uv]
build-constraint-dependencies = [
  "editables==0.5",
  "hatchling==1.31.0",
  "packaging==26.2",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "trove-classifiers==2026.6.1.19",
]

[tool.hatch.build.targets.sdist]
include = [
  "/build-constraints.txt",
  "/pyproject.toml",
  "/README.md",
  "/src/olympus",
]
exclude = [
  "/.env",
  "/.env.*",
  "/.venv",
  "/**/__pycache__",
  "/**/.mypy_cache",
  "/**/.pytest_cache",
  "/**/.ruff_cache",
  "/outputs",
  "/work",
]

[tool.hatch.build.targets.wheel]
packages = ["src/olympus"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["olympus"]
mypy_path = ["src"]
