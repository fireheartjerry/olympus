name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OLYMPUS_TEST_DATABASE_DSN: postgresql+asyncpg://olympus_test:olympus_test_password@127.0.0.1:5432/olympus_test
    services:
      postgres:
        # postgres:17.6-bookworm, linux/amd64 manifest
        image: postgres@sha256:45cd22f8d32e189d245403954882f88e7a8714301fda80dab6da90f1265b25a3
        env:
          POSTGRES_DB: olympus_test
          POSTGRES_USER: olympus_test
          POSTGRES_PASSWORD: olympus_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=olympus_test --dbname=olympus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v6.7.0
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4
        with:
          enable-cache: true
          version: 0.11.19
          checksum: 7035608168e106375b36d0c818d537a889c51a8625fe7f8f7cad5e62b947c368
      - name: Install CPython 3.13.13
        run: uv python install 3.13.13
      - name: Verify the dependency lock
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Build with hash-pinned isolated dependencies
        run: |
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/olympus-build-environment"
          uv build \
            --no-cache \
            --build-constraints build-constraints.txt \
            --require-hashes \
            --out-dir "$RUNNER_TEMP/olympus-dist"
      - name: Reject unsafe distribution contents
        run: >-
          uv run python -m olympus.build.verify_distribution
          "$RUNNER_TEMP"/olympus-dist/*.whl
          "$RUNNER_TEMP"/olympus-dist/*.tar.gz
      - name: Import from a fresh locked runtime environment
        run: |
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/olympus-runtime-environment"
          uv sync --locked --no-dev
          "$UV_PROJECT_ENVIRONMENT/bin/python" -c "import olympus; assert olympus.__version__ == '0.1.0'"
      - name: Check formatting
        run: uv run ruff format --check src tests migrations
      - name: Lint
        run: uv run ruff check src tests migrations
      - name: Type-check in strict mode
        run: uv run mypy
      - name: Verify PostgreSQL migrations round trip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Test with warnings as errors
        run: uv run pytest -W error

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBERNETES_VERSION: 1.36.1
      KUBECONFORM_SCHEMA_LOCATION: "https://raw.githubusercontent.com/yannh/kubernetes-json-schema/05eeed51991935dd1f47cd3b3682de4e8af233f3/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}.json"
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v6.7.0
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4
        with:
          enable-cache: true
          version: 0.11.19
          checksum: 7035608168e106375b36d0c818d537a889c51a8625fe7f8f7cad5e62b947c368
      - name: Install CPython 3.13.13 and locked dependencies
        run: |
          uv python install 3.13.13
          uv lock --check
          uv sync --locked --all-groups
      - name: Install verified Helm 3.17.3
        env:
          HELM_SHA256: ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd
          HELM_VERSION: 3.17.3
        run: |
          archive="$RUNNER_TEMP/helm-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/helm"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check --status
          mkdir --parents "$install_dir/bin"
          tar --extract --gzip --file "$archive" --directory "$install_dir" linux-amd64/helm
          install --mode=0755 "$install_dir/linux-amd64/helm" "$install_dir/bin/helm"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
      - name: Install verified kubeconform 0.8.0
        env:
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          KUBECONFORM_VERSION: 0.8.0
        run: |
          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/kubeconform"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          printf '%s  %s\n' "$KUBECONFORM_SHA256" "$archive" | sha256sum --check --status
          mkdir --parents "$install_dir/bin"
          tar --extract --gzip --file "$archive" --directory "$install_dir" kubeconform
          install --mode=0755 "$install_dir/kubeconform" "$install_dir/bin/kubeconform"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
      - name: Lint chart strictly
        run: helm lint --strict deploy/helm/olympus-foundation
      - name: Render chart
        run: >-
          helm template olympus deploy/helm/olympus-foundation --namespace agent-control
          > "$RUNNER_TEMP/olympus-foundation.yaml"
      - name: Validate rendered Kubernetes resources strictly
        run: >-
          kubeconform -summary -strict -kubernetes-version "$KUBERNETES_VERSION"
          -schema-location "$KUBECONFORM_SCHEMA_LOCATION"
          "$RUNNER_TEMP/olympus-foundation.yaml"
      - name: Verify fixed capacity and override guardrails
        run: >-
          pwsh -NoLogo -NoProfile -File deploy/helm/olympus-foundation/tests/verify.ps1
          -HelmPath helm -KubeconformPath kubeconform -KubernetesVersion "$KUBERNETES_VERSION"
          -SchemaLocation "$KUBECONFORM_SCHEMA_LOCATION"
